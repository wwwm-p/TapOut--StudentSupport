<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Support</title>
<link rel="stylesheet" href="style.css" />

<!-- PWA Manifest -->
<link rel="manifest" href="/student-manifest.json" />

<meta name="theme-color" content="#0070c9" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Student Support" />

<!-- Icons -->
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192-student.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512-student.png">

<style>
* { box-sizing: border-box; margin:0; padding:0; }
.page { display: none; position: relative; }
.page.active { display: block; text-align:center; }
.page img { width: 100%; pointer-events: none; user-select: none; height: auto; display: block; }
.hotspot { position: absolute; z-index: 10; cursor: pointer; }
.back-button { margin-top:10px; padding:8px 12px; border-radius:12px; border:none; cursor:pointer; background:#ccc; }
.modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(6px); }
.modal { width: 360px; margin: 0 auto; background: #fff; padding: 28px 26px; border-radius: 18px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.22); border: 1px solid #eef2f7; }
.modal h2 { margin: 0 0 14px; font-size: 20px; font-weight: 700; color: #0f172a; }
.modal input, .modal textarea { width: 100%; margin-bottom: 12px; padding: 11px 12px; font-size: 14px; border-radius: 12px; border: 1px solid #e6e8ec; background: #f9fafb; text-align: center; transition: border 0.2s, box-shadow 0.2s; }
.modal input:focus, .modal textarea:focus { outline:none; border:1px solid #0070c9; box-shadow:0 0 0 3px rgba(0,112,201,0.2); background:#fff; }
.modal textarea { resize:none; height:90px; }
.modal-buttons { display:flex; justify-content:center; gap:12px; margin-top:6px; }
.modal-buttons button { padding:9px 18px; border-radius:999px; border:none; cursor:pointer; font-size:14px; }
.modal-buttons button:first-child { background:#f1f5f9; color:#334155; }
.modal-buttons button:last-child { background:#0070c9; color:white; }
.counselor-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:10px; }
.counselor-grid button { padding:8px 12px; border-radius:12px; border:none; cursor:pointer; background:#0070c9; color:white; }
.install-button { position: fixed; bottom: 20px; right: 20px; z-index: 2000; padding: 12px 18px; background:#0070c9; color:white; border:none; border-radius:24px; cursor:pointer; font-size:16px; display:none; }
body { max-width: 100%; overflow-x: hidden; }
</style>
</head>
<body>

<!-- Pages (same as before) -->
<div class="page active" id="page1">
  <img src="page1.png" alt="Welcome Page">
  <button class="hotspot academic" onclick="chooseReason('Academic stress or pressure')"></button>
  <button class="hotspot anxiety" onclick="chooseReason('Anxiety or panic attacks')"></button>
  <button class="hotspot depression" onclick="chooseReason('Depression or sadness')"></button>
  <button class="hotspot family" onclick="chooseReason('Family issues or home stress')"></button>
  <button class="hotspot relationship" onclick="chooseReason('Relationship or friendship problems')"></button>
  <button class="hotspot bullying" onclick="chooseReason('Bullying or harassment')"></button>
  <button class="hotspot talk" onclick="chooseReason('I just need someone to talk to')"></button>
  <button class="hotspot unsure" onclick="chooseReason('I’m not ready to say')"></button>
</div>
<div class="page" id="page2">
  <img src="page2.png" alt="Urgency Page">
  <button class="hotspot fine" onclick="chooseUrgency('I’m Doing Fine – Just Curious')"></button>
  <button class="hotspot littleoff" onclick="chooseUrgency('Feeling a Little Off')"></button>
  <button class="hotspot coping" onclick="chooseUrgency('I’m Not Coping Well')"></button>
  <button class="hotspot crisis" onclick="chooseUrgency('I’m in Crisis')"></button>
  <button class="back-button" onclick="goToPage('page1')">Back</button>
</div>
<div class="page" id="page3">
  <img src="page3.png" alt="Counselor Page">
  <div class="counselor-grid" id="counselorGrid"></div>
  <button class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<!-- Install Button -->
<button class="install-button" id="installButton">Install App</button>

<script>
let selectedReason="",selectedUrgency="",selectedCounselor="",selectedCounselorEmail="";

// Navigation functions
function goToPage(id){ document.querySelectorAll(".page").forEach(p=>p.classList.remove("active")); document.getElementById(id)?.classList.add("active"); }
function chooseReason(reason){ selectedReason=reason; goToPage("page2"); }
function chooseUrgency(urgency){ selectedUrgency=urgency; urgency==="I’m in Crisis"?openCrisisModal():goToPage("page3"); }

// Service Worker
if("serviceWorker"in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("/service-worker.js").catch(err=>console.warn(err)); }); }

// Install PWA
let deferredPrompt;
const installBtn = document.getElementById("installButton");

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});

installBtn.addEventListener('click', async ()=>{
  installBtn.style.display = 'none';
  if(deferredPrompt){
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    console.log('Install choice:', choice.outcome);
    deferredPrompt = null;
  }
});

// INIT
window.onload = async()=>{ await populateStudentCounselorDropdown(); };

// Populate counselors
async function populateStudentCounselorDropdown(){
  let counselors=[{username:"counselor1",email:"counselor1@example.com",name:"Counselor One"}];
  const grid=document.getElementById("counselorGrid");
  grid.innerHTML = "";
  counselors.forEach(c=>{ const btn=document.createElement("button"); btn.textContent=c.email; btn.onclick=()=>openModal(c.username,c.email); grid.appendChild(btn); });
}

// Modals (placeholder)
function openModal(u,e){ console.log("Open modal for",u,e); }
function openCrisisModal(){ console.log("Crisis modal"); }
</script>
</body>
</html>
