<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapOut! – Student Test</title>
<link rel="stylesheet" href="/style.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{overflow-x:hidden;}
.page{display:none;position:relative;}
.page.active{display:block;text-align:center;background:#f7f7f7;}
.page img{width:100%;height:auto;display:block;}
.hotspot{position:absolute;z-index:10;cursor:pointer;background:rgba(255,0,0,0.3);border:1px solid red;}
.back-button{margin-top:10px;padding:8px 12px;border-radius:12px;border:none;cursor:pointer;background:#ccc;}
</style>
</head>
<body>

<div class="page active" id="page1">
  <img src="/page1.png" alt="Page 1">
  <!-- Example visible hotspots -->
  <button class="hotspot" style="top:10%;left:10%;width:100px;height:50px;" onclick="chooseReason('Academic stress')">Academic</button>
  <button class="hotspot" style="top:20%;left:10%;width:100px;height:50px;" onclick="chooseReason('Anxiety')">Anxiety</button>
</div>

<div class="page" id="page2">
  <img src="/page2.png" alt="Page 2">
  <button class="hotspot" style="top:10%;left:10%;width:120px;height:50px;" onclick="chooseUrgency('Fine')">Fine</button>
  <button class="hotspot" style="top:20%;left:10%;width:120px;height:50px;" onclick="chooseUrgency('Crisis')">Crisis</button>
  <button class="back-button" onclick="goToPage('page1')">Back</button>
</div>

<div class="page" id="page3">
  <img src="/page3.png" alt="Page 3">
  <div id="counselorGrid"></div>
  <button class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<script>
function goToPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const page=document.getElementById(id);
  if(page) page.classList.add('active');
}
function chooseReason(reason){console.log('Reason:',reason); goToPage('page2');}
function chooseUrgency(urgency){console.log('Urgency:',urgency); goToPage('page3');}

// Counselor fallback (so page3 never fails)
function populateStudentCounselorDropdown(){
  const grid=document.getElementById('counselorGrid');
  grid.innerHTML='';
  const fallback=[{username:'counselor1',email:'counselor1@example.com'},{username:'counselor2',email:'counselor2@example.com'}];
  fallback.forEach(c=>{
    const btn=document.createElement('button');
    btn.textContent=c.email;
    btn.onclick=()=>alert(`Selected: ${c.email}`);
    grid.appendChild(btn);
  });
}
window.addEventListener('load', populateStudentCounselorDropdown);
</script>
</body>
</html>
