<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapOut – Student Support</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#fffcf5;
color:#0f172a;
}

/* ------------------------
Header
------------------------ */

header{
background:#0f172a;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

/* ------------------------
Student Verification
------------------------ */

.verify-box{
max-width:500px;
margin:40px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.verify-box h2{
margin-top:0;
}

input, select, textarea{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #ddd;
font-size:14px;
}

textarea{
height:100px;
resize:none;
}

/* ------------------------
Buttons
------------------------ */

button{
background:#2563eb;
color:white;
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
font-size:14px;
}

button:hover{
background:#1e4fd1;
}

/* Crisis Button */

.crisis{
background:#dc2626;
}

.crisis:hover{
background:#b91c1c;
}

/* ------------------------
Message Status
------------------------ */

.status{
margin-top:15px;
font-weight:600;
}

</style>
</head>

<body>

<header>
Student Support Request
</header>


<div class="verify-box">

<h2>Verify Student</h2>

<label>Student ID</label>
<input id="studentID" placeholder="Example: 123456">

<label>First Name</label>
<input id="firstName" placeholder="Example: Alex">

<label>Last Name</label>
<input id="lastName" placeholder="Example: Rivera">

<label>Grade</label>
<select id="grade">
<option value="">Select Grade</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>
</select>

<button onclick="verifyStudent()">Verify</button>

</div>


<div class="verify-box" id="messageBox" style="display:none;">

<h2>Send Message</h2>

<label>Select Counselor</label>
<select id="counselorDropdown"></select>

<label>Message</label>
<textarea id="studentMessage" placeholder="Type your message here..."></textarea>

<button onclick="sendMessage()">Send Message</button>

<hr>

<h3>Crisis Support</h3>

<p>If you are in immediate danger or crisis, send directly to administration.</p>

<button class="crisis" onclick="sendCrisis()">Send Crisis Alert</button>

<div class="status" id="statusMsg"></div>

</div>



<script>

/* ==========================
Student Verification
========================== */

let verifiedStudent = null;

function verifyStudent(){

const id = document.getElementById("studentID").value;
const first = document.getElementById("firstName").value;
const last = document.getElementById("lastName").value;
const grade = document.getElementById("grade").value;

if(!id || !first || !last || !grade){
alert("Please fill all fields");
return;
}

/* 
Example verification
Future SIS will replace this section
*/

verifiedStudent = {
student_id:id,
first_name:first,
last_name:last,
grade:grade
};

document.querySelector(".verify-box").style.display="none";
document.getElementById("messageBox").style.display="block";

loadCounselors();

}


/* ==========================
Load Counselors From Admin
========================== */

async function loadCounselors(){

try{

const res = await fetch("/api/editcounselor?action=counselors_with_students");
const data = await res.json();

if(!data.success) return;

const dropdown = document.getElementById("counselorDropdown");

dropdown.innerHTML = "";

data.counselors
.filter(c=>c.active)
.forEach(c=>{

const option = document.createElement("option");

option.value = c.id;
option.textContent = `${c.name} (${c.email})`;

dropdown.appendChild(option);

});

}catch(err){
console.error(err);
}

}


/* ==========================
Send Message To Counselor
========================== */

async function sendMessage(){

const counselor_id = document.getElementById("counselorDropdown").value;
const message = document.getElementById("studentMessage").value;

if(!message){
alert("Enter a message");
return;
}

try{

const res = await fetch("/api/studentmessage",{

method:"POST",
headers:{ "Content-Type":"application/json" },

body:JSON.stringify({

student_id:verifiedStudent.student_id,
first_name:verifiedStudent.first_name,
last_name:verifiedStudent.last_name,
grade:verifiedStudent.grade,

counselor_id:counselor_id,
message:message,
type:"normal"

})

});

const data = await res.json();

if(data.success){

document.getElementById("statusMsg").innerText="Message Sent";

document.getElementById("studentMessage").value="";

}

}catch(err){
console.error(err);
}

}


/* ==========================
Crisis Message → Admin Only
========================== */

async function sendCrisis(){

const message = document.getElementById("studentMessage").value;

if(!message){
alert("Enter a message");
return;
}

try{

const res = await fetch("/api/studentmessage",{

method:"POST",
headers:{ "Content-Type":"application/json" },

body:JSON.stringify({

student_id:verifiedStudent.student_id,
first_name:verifiedStudent.first_name,
last_name:verifiedStudent.last_name,
grade:verifiedStudent.grade,

message:message,
type:"crisis"

})

});

const data = await res.json();

if(data.success){

document.getElementById("statusMsg").innerText="Crisis Alert Sent";

document.getElementById("studentMessage").value="";

}

}catch(err){
console.error(err);
}

}

</script>

</body>
</html>
