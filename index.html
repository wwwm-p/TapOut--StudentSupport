<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Support</title>

<link rel="stylesheet" href="style.css">

<style>

*{box-sizing:border-box}

/* PAGES */

.page{
display:none;
text-align:center;
}

.page.active{
display:block;
}

/* MODALS */

.modal-overlay{
position:fixed;
inset:0;
background:rgba(15,23,42,.55);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
backdrop-filter:blur(6px);
}

.modal{
width:360px;
background:white;
padding:26px;
border-radius:18px;
text-align:center;
box-shadow:0 24px 60px rgba(0,0,0,.22);
border:1px solid #eef2f7;
}

.modal h2{
margin:0 0 14px;
font-size:20px;
font-weight:700;
}

.modal input,
.modal textarea{
width:100%;
margin-bottom:12px;
padding:11px;
border-radius:12px;
border:1px solid #e6e8ec;
background:#f9fafb;
text-align:center;
}

.modal textarea{
height:90px;
resize:none;
}

.modal-buttons{
display:flex;
gap:12px;
justify-content:center;
}

.modal-buttons button{
padding:9px 18px;
border-radius:999px;
border:none;
cursor:pointer;
}

.modal-buttons button:first-child{
background:#f1f5f9;
}

.modal-buttons button:last-child{
background:#0070c9;
color:white;
}

/* COUNSELOR GRID */

.counselor-grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin-top:20px;
}

.counselor-grid button{
padding:10px 14px;
border-radius:12px;
border:none;
background:#0070c9;
color:white;
cursor:pointer;
}

/* BACK BUTTON */

.back-button{
margin-top:16px;
padding:10px 14px;
border-radius:12px;
border:none;
background:#d1d5db;
cursor:pointer;
}

</style>
</head>

<body>

<!-- PAGE 1 -->

<div class="page active" id="page1">

<img src="page1.png">

<button onclick="chooseReason('Academic Stress')">Academic Stress</button>
<button onclick="chooseReason('Anxiety or Panic Attacks')">Anxiety</button>
<button onclick="chooseReason('Depression or Sadness')">Depression</button>
<button onclick="chooseReason('Family Issues')">Family Issues</button>
<button onclick="chooseReason('Relationship Problems')">Relationships</button>
<button onclick="chooseReason('Bullying')">Bullying</button>
<button onclick="chooseReason('Just Need Someone To Talk To')">Talk</button>
<button onclick="chooseReason('Not Ready To Say')">Not Ready</button>

</div>

<!-- PAGE 2 -->

<div class="page" id="page2">

<img src="page2.png">

<button onclick="chooseUrgency('I’m Doing Fine – Just Curious')">
I'm Doing Fine
</button>

<button onclick="chooseUrgency('Feeling a Little Off')">
Feeling A Little Off
</button>

<button onclick="chooseUrgency('I’m Not Coping Well')">
Not Coping Well
</button>

<button onclick="chooseUrgency('I’m in Crisis')">
I'm In Crisis
</button>

<button class="back-button" onclick="goToPage('page1')">
Back
</button>

</div>

<!-- PAGE 3 -->

<div class="page" id="page3">

<h2>Select Counselor</h2>

<div class="counselor-grid">

<button onclick="openModal('counselor1','counselor1@example.com')">
counselor1@example.com
</button>

<button onclick="openModal('counselor2','counselor2@example.com')">
counselor2@example.com
</button>

<button onclick="openModal('counselor3','counselor3@example.com')">
counselor3@example.com
</button>

<button onclick="openModal('counselor4','counselor4@example.com')">
counselor4@example.com
</button>

<button onclick="openModal('counselor5','counselor5@example.com')">
counselor5@example.com
</button>

<button onclick="openModal('counselor6','counselor6@example.com')">
counselor6@example.com
</button>

</div>

<button class="back-button" onclick="goToPage('page2')">
Back
</button>

</div>

<!-- STUDENT MODAL -->

<div class="modal-overlay" id="modalOverlay">

<div class="modal">

<h2>Submit Message</h2>

<input id="firstName" placeholder="First Name">

<input id="lastName" placeholder="Last Name">

<input id="studentGrade" placeholder="Grade">

<input id="studentId" placeholder="Student ID">

<textarea id="extraNotes" placeholder="Additional notes"></textarea>

<div class="modal-buttons">

<button onclick="closeModal()">Cancel</button>

<button onclick="submitMessage()">Submit</button>

</div>

</div>

</div>

<!-- SUCCESS MODAL -->

<div class="modal-overlay" id="successOverlay">

<div class="modal">

<h2>Message Sent</h2>

<button onclick="closeSuccess()">OK</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
