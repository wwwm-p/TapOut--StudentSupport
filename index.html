<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapOut! - Student</title>

<link rel="stylesheet" href="/style.css">

<!-- PWA -->
<link rel="manifest" href="/student-manifest.json">
<meta name="theme-color" content="#0070c9">
<meta name="description" content="Student support app">
<link rel="apple-touch-icon" href="/icons/icon-192-student.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{overflow-x:hidden;}
.page{display:none;position:relative;}
.page.active{display:block;text-align:center;background:#f7f7f7;}
.page img{width:100%;height:auto;display:block;}

.hotspot{position:absolute;z-index:10;cursor:pointer;}

.back-button{
  margin-top:10px;
  padding:8px 12px;
  border-radius:12px;
  border:none;
  background:#ccc;
  cursor:pointer;
}

.counselor-grid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

.counselor-grid button{
  padding:8px 12px;
  border-radius:12px;
  border:none;
  background:#0070c9;
  color:white;
  cursor:pointer;
}

.install-btn{
  padding:6px 10px;
  border-radius:6px;
  border:none;
  background:#0070c9;
  color:white;
  cursor:pointer;
  display:none;
}
</style>
</head>

<body>

<!-- Install button -->
<div style="padding:10px;text-align:center;">
  <button id="installBtn" class="install-btn">Install App</button>
</div>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  <img src="/page1.png" alt="Welcome Page">

  <button class="hotspot academic" onclick="chooseReason('Academic')"></button>
  <button class="hotspot anxiety" onclick="chooseReason('Anxiety')"></button>
  <button class="hotspot depression" onclick="chooseReason('Depression')"></button>
  <button class="hotspot family" onclick="chooseReason('Family')"></button>
  <button class="hotspot relationship" onclick="chooseReason('Relationship')"></button>
  <button class="hotspot bullying" onclick="chooseReason('Bullying')"></button>
  <button class="hotspot talk" onclick="chooseReason('Talk')"></button>
  <button class="hotspot unsure" onclick="chooseReason('Unsure')"></button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <img src="/page2.png" alt="Urgency Page">

  <button class="hotspot fine" onclick="chooseUrgency('Fine')"></button>
  <button class="hotspot littleoff" onclick="chooseUrgency('Off')"></button>
  <button class="hotspot coping" onclick="chooseUrgency('Coping')"></button>
  <button class="hotspot crisis" onclick="chooseUrgency('Crisis')"></button>

  <button class="back-button" onclick="goToPage('page1')">Back</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <img src="/page3.png" alt="Counselor Page">

  <div class="counselor-grid" id="counselorGrid"></div>

  <button class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<script>
let selectedReason = "", selectedUrgency = "";

/* NAVIGATION */
function goToPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function chooseReason(r){
  selectedReason = r;
  goToPage("page2");
}

function chooseUrgency(u){
  selectedUrgency = u;
  goToPage("page3");
}

/* EXAMPLE COUNSELORS */
const counselors = [
  {email:"counselor1@example.com"},
  {email:"counselor2@example.com"}
];

function loadCounselors(){
  const grid = document.getElementById("counselorGrid");
  grid.innerHTML = "";

  counselors.forEach(c=>{
    const btn = document.createElement("button");
    btn.textContent = c.email;
    btn.onclick = ()=>alert("Selected: " + c.email);
    grid.appendChild(btn);
  });
}

window.addEventListener("load", loadCounselors);

/* SERVICE WORKER */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
  });
}

/* INSTALL BUTTON */
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});

installBtn.onclick = async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  installBtn.style.display = 'none';
};
</script>

</body>
</html>
