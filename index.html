<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapOut! – Student</title>

<link rel="stylesheet" href="style.css">

<!-- PWA -->
<link rel="manifest" href="/student-manifest.json">
<meta name="theme-color" content="#0070c9">
<link rel="apple-touch-icon" href="/icons/icon-192-student.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TapOut! – Student">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{overflow-x:hidden;}
.page{display:none;position:relative;}
.page.active{display:block;text-align:center;}
.page img{width:100%;height:auto;display:block;}
.hotspot{position:absolute;z-index:20;cursor:pointer;background:rgba(0,0,0,0.001);border:none;} /* transparent but clickable */
.back-button{margin-top:10px;padding:8px 12px;border-radius:12px;border:none;cursor:pointer;background:#ccc;}
.counselor-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;}
.counselor-grid button{padding:8px 12px;border-radius:12px;border:none;background:#0070c9;color:white;cursor:pointer;}
.install-btn{padding:6px 10px;border-radius:6px;border:1px solid #0070c9;background:#0070c9;color:white;cursor:pointer;display:none;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:999;}
.modal-overlay.active{display:flex;}
.modal{background:#fff;max-width:560px;width:90%;padding:20px;border-radius:12px;text-align:left;}
.crisis-list{list-style:none;padding:0;margin:12px 0;line-height:1.4;}
.crisis-section{margin-bottom:12px;}
.crisis-actions{display:flex;gap:10px;justify-content:flex-end;}
.crisis-actions .primary{background:#0070c9;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;}
.crisis-actions .secondary{background:#eee;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;}
</style>
</head>
<body>

<!-- Install button -->
<div style="padding:10px;text-align:center;">
  <button class="install-btn" id="installBtn">Install App</button>
</div>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  <img src="page1.png" alt="Welcome Page">
  <div id="hotspotContainerPage1" style="position:absolute;top:0;left:0;width:100%;height:100%;"></div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <img src="page2.png" alt="Urgency Page">
  <div id="hotspotContainerPage2" style="position:absolute;top:0;left:0;width:100%;height:100%;"></div>
  <button class="back-button" onclick="goToPage('page1')">Back</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <img src="page3.png" alt="Counselor Page">
  <div class="counselor-grid" id="counselorGrid"></div>
  <button class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<!-- CRISIS MODAL -->
<div class="modal-overlay" id="crisisOverlay">
  <div class="modal crisis-modal">
    <h2>Immediate Support</h2>
    <ul class="crisis-list" id="crisisList"></ul>
    <div class="crisis-actions">
      <button type="button" class="secondary" onclick="closeCrisisModal()">Close</button>
      <button type="button" class="primary" onclick="continueFromCrisis()">Continue</button>
    </div>
  </div>
</div>

<script>
let selectedReason = "";
let selectedUrgency = "";

/* NAVIGATION */
function goToPage(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id)?.classList.add("active");
}
function chooseReason(reason){
  selectedReason = reason;
  goToPage('page2');
}
function chooseUrgency(urgency){
  selectedUrgency = urgency;
  if(urgency === "I'm in Crisis"){
    openCrisisModal();
  } else {
    goToPage('page3');
  }
}

/* CRISIS MODAL */
function openCrisisModal(){ document.getElementById('crisisOverlay').classList.add('active'); }
function closeCrisisModal(){ document.getElementById('crisisOverlay').classList.remove('active'); }
function continueFromCrisis(){ closeCrisisModal(); goToPage('page3'); }

/* SERVICE WORKER */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/service-worker.js')
    .then(() => console.log('SW registered'))
    .catch(err => console.warn('SW registration failed:', err));
}

/* INSTALL BUTTON */
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if(installBtn) installBtn.style.display = 'inline-block';
});
if(installBtn){
  installBtn.addEventListener('click', async () => {
    installBtn.style.display = 'none';
    if(deferredPrompt){
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
    }
  });
}

/* HOTSPOTS CREATION */
function createHotspots(containerId, hotspots){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  hotspots.forEach(h => {
    const btn = document.createElement('button');
    btn.className = 'hotspot ' + h.class;
    btn.style.position = 'absolute';
    btn.style.top = h.top;
    btn.style.left = h.left;
    btn.style.width = h.width;
    btn.style.height = h.height;
    btn.onclick = () => h.onClick();
    container.appendChild(btn);
  });
}

/* PAGE 1 HOTSPOTS */
createHotspots('hotspotContainerPage1', [
  {class:'academic', top:'10%', left:'10%', width:'20%', height:'8%', onClick:() => chooseReason('Academic stress or pressure')},
  {class:'anxiety', top:'20%', left:'10%', width:'20%', height:'8%', onClick:() => chooseReason('Anxiety or panic attacks')},
  {class:'depression', top:'30%', left:'10%', width:'20%', height:'8%', onClick:() => chooseReason('Depression or sadness')},
  {class:'family', top:'40%', left:'10%', width:'20%', height:'8%', onClick:() => chooseReason('Family issues or home stress')},
  {class:'relationship', top:'50%', left:'10%', width:'20%', height:'8%', onClick:() => chooseReason('Relationship or friendship problems')},
  {class:'bullying', top:'60%', left:'10%', width:'20%', height:'8%', onClick:() => chooseReason('Bullying or harassment')},
  {class:'talk', top:'70%', left:'10%', width:'20%', height:'8%', onClick:() => chooseReason('I just need someone to talk to')},
  {class:'unsure', top:'80%', left:'10%', width:'20%', height:'8%', onClick:() => chooseReason("I'm not ready to say")}
]);

/* PAGE 2 HOTSPOTS */
createHotspots('hotspotContainerPage2', [
  {class:'fine', top:'10%', left:'10%', width:'25%', height:'8%', onClick:() => chooseUrgency("I'm Doing Fine – Just Curious")},
  {class:'littleoff', top:'25%', left:'10%', width:'25%', height:'8%', onClick:() => chooseUrgency('Feeling a Little Off')},
  {class:'coping', top:'40%', left:'10%', width:'25%', height:'8%', onClick:() => chooseUrgency("I'm Not Coping Well")},
  {class:'crisis', top:'55%', left:'10%', width:'25%', height:'8%', onClick:() => chooseUrgency("I'm in Crisis")}
]);

/* COUNSELORS */
const exampleCounselors = [
  { username: 'counselor1', email: 'counselor1@example.com' },
  { username: 'counselor2', email: 'counselor2@example.com' }
];
function populateStudentCounselorDropdown(){
  const grid = document.getElementById('counselorGrid');
  grid.innerHTML = '';
  exampleCounselors.forEach(c => {
    const btn = document.createElement('button');
    btn.textContent = c.email;
    btn.onclick = () => console.log('Open modal for', c.username, c.email);
    grid.appendChild(btn);
  });
}

/* CRISIS DATA */
const exampleCrisis = [
  {title:'Emergency', info:'Call 911 for life-threatening crises'},
  {title:'Suicide & Crisis', info:'Call or text 988 (24/7, free, confidential)'},
  {title:'Eating Disorder Support', info:'Call 1-800-931-2237'},
  {title:'Domestic Violence Support', info:'Call 1-800-799-7233'},
  {title:'Sexual Assault Support', info:'Call 1-800-656-4673'},
  {title:'Substance Abuse & Addiction Support', info:'Call 1-800-662-4357'},
  {title:'LGBTQ Youth Support', info:'Call 1-866-488-7386'}
];
function populateCrisisList(){
  const list = document.getElementById('crisisList');
  list.innerHTML = '';
  exampleCrisis.forEach(c => {
    const li = document.createElement('li');
    li.className = 'crisis-section';
    li.innerHTML = `<strong>${c.title}</strong><br>${c.info}`;
    list.appendChild(li);
  });
}
populateCrisisList();

/* INIT */
window.addEventListener('load', () => {
  populateStudentCounselorDropdown();
});
</script>

</body>
</html>
