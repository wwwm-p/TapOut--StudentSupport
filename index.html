<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Support</title>
<link rel="stylesheet" href="style.css" />
<style>
* { box-sizing: border-box; }
.page { display: none; }
.page.active { display: block; text-align:center; }
.modal-overlay {
  position: fixed; inset:0; background: rgba(15,23,42,0.55);
  display:none; justify-content:center; align-items:center; z-index:1000;
  backdrop-filter: blur(6px);
}
.modal {
  width:360px; margin:0 auto; background:#fff; padding:28px 26px;
  border-radius:18px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,0.22);
  border:1px solid #eef2f7;
}
.modal h2 { margin:0 0 14px 0; font-size:20px; font-weight:700; color:#0f172a; }
.modal input, .modal textarea {
  width:100%; margin-bottom:12px; padding:11px 12px;
  font-size:14px; border-radius:12px; border:1px solid #e6e8ec;
  background:#f9fafb; text-align:center; transition:border 0.2s, box-shadow 0.2s;
}
.modal input:focus, .modal textarea:focus {
  outline:none; border:1px solid #0070c9; box-shadow:0 0 0 3px rgba(0,112,201,0.2); background:#fff;
}
.modal textarea { resize:none; height:90px; }
.modal-buttons { display:flex; justify-content:center; gap:12px; margin-top:6px; }
.modal-buttons button {
  padding:9px 18px; border-radius:999px; border:none; cursor:pointer; font-size:14px;
}
.modal-buttons button:first-child { background:#f1f5f9; color:#334155; }
.modal-buttons button:last-child { background:#0070c9; color:white; }
.crisis-modal { width:min(560px,92vw); text-align:left; }
.crisis-modal h2 { text-align:center; }
.crisis-list { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; font-size:14px; color:#0f172a; }
.crisis-list strong { display:block; font-size:15px; }
.crisis-section { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; }
.crisis-actions { display:flex; justify-content:center; gap:12px; margin-top:14px; }
.crisis-actions .secondary { background:#f1f5f9; color:#334155; }
.crisis-actions .primary { background:#0070c9; color:#fff; }
.counselor-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:10px; }
.counselor-grid button { padding:8px 12px; border-radius:12px; border:none; cursor:pointer; background:#0070c9; color:white; }
.back-button { margin-top:10px; padding:8px 12px; border-radius:12px; border:none; cursor:pointer; background:#ccc; }
</style>
</head>
<body>

<!-- Page 1: Reason -->
<div class="page active" id="page1">
  <img src="page1.png" alt="Welcome Page">
  <button onclick="chooseReason('Academic stress or pressure')">Academic stress</button>
  <button onclick="chooseReason('Anxiety or panic attacks')">Anxiety</button>
  <button onclick="chooseReason('Depression or sadness')">Depression</button>
  <button onclick="chooseReason('Family issues or home stress')">Family issues</button>
  <button onclick="chooseReason('Relationship or friendship problems')">Relationship problems</button>
  <button onclick="chooseReason('Bullying or harassment')">Bullying</button>
  <button onclick="chooseReason('I just need someone to talk to')">Just talk</button>
  <button onclick="chooseReason('I’m not ready to say')">Not ready</button>
</div>

<!-- Page 2: Urgency -->
<div class="page" id="page2">
  <img src="page2.png" alt="Urgency Page">
  <button onclick="chooseUrgency('I’m Doing Fine – Just Curious')">Just Curious</button>
  <button onclick="chooseUrgency('Feeling a Little Off')">Feeling Off</button>
  <button onclick="chooseUrgency('I’m Not Coping Well')">Not Coping Well</button>
  <button onclick="chooseUrgency('I’m in Crisis')">Crisis</button>
  <button class="back-button" onclick="goToPage('page1')">Back</button>
</div>

<!-- Page 3: Counselor Selection -->
<div class="page" id="page3">
  <img src="page3.png" alt="Counselor Page">
  <div class="counselor-grid">
    <button onclick="openModal('example1','example1@example.com')">example1@example.com</button>
    <button onclick="openModal('example2','example2@example.com')">example2@example.com</button>
    <button onclick="openModal('example3','example3@example.com')">example3@example.com</button>
    <button onclick="openModal('example4','example4@example.com')">example4@example.com</button>
    <button onclick="openModal('example5','example5@example.com')">example5@example.com</button>
    <button onclick="openModal('example6','example6@example.com')">example6@example.com</button>
  </div>
  <button class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<!-- Crisis Modal -->
<div class="modal-overlay" id="crisisOverlay">
  <div class="modal crisis-modal">
    <h2>Immediate Support</h2>
    <ul class="crisis-list">
      <li class="crisis-section"><strong>Emergency</strong> 911 – Emergency services.</li>
      <li class="crisis-section"><strong>Mental Health & Crisis Support</strong>
        988 Suicide & Crisis Lifeline – Call/text 988.<br>
        Crisis Text Line – Text HOME to 741741.
      </li>
    </ul>
    <div class="crisis-actions">
      <button class="secondary" onclick="closeCrisisModal()">Close</button>
      <button class="primary" onclick="continueFromCrisis()">Continue to Counselor</button>
    </div>
  </div>
</div>

<!-- Student Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Submit Message</h2>
    <input type="text" id="firstName" placeholder="First Name (required)">
    <input type="text" id="lastName" placeholder="Last Name (required)">
    <input type="text" id="studentGrade" placeholder="Grade (required)">
    <input type="text" id="studentId" placeholder="Student ID (required)">
    <textarea id="extraNotes" placeholder="Additional notes (optional)"></textarea>
    <div class="modal-buttons">
      <button onclick="closeModal()">Cancel</button>
      <button onclick="submitMessage()">Submit</button>
    </div>
  </div>
</div>

<!-- Success Modal -->
<div class="modal-overlay" id="successOverlay">
  <div class="modal success-modal">
    <div class="success-icon">✓</div>
    <div class="success-text">Message sent!</div>
    <div class="success-actions">
      <button onclick="closeSuccess()">OK</button>
    </div>
  </div>
</div>

<script>
// -------------------
// State
// -------------------
let selectedReason = "";
let selectedUrgency = "";
let selectedCounselor = "";
let selectedCounselorEmail = "";

// -------------------
// Navigation
// -------------------
function goToPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  const page = document.getElementById(id);
  if (page) page.classList.add("active");
}

// -------------------
// Reason/Urgency
// -------------------
function chooseReason(reason) { selectedReason = reason; goToPage("page2"); }
function chooseUrgency(urgency) {
  selectedUrgency = urgency;
  if (urgency === "I’m in Crisis") openCrisisModal();
  else goToPage("page3");
}

// -------------------
// Modals
// -------------------
function openCrisisModal() { document.getElementById("crisisOverlay").style.display="flex"; }
function closeCrisisModal() { document.getElementById("crisisOverlay").style.display="none"; }
function continueFromCrisis() { closeCrisisModal(); goToPage("page3"); }
function openModal(username,email) { selectedCounselor=username; selectedCounselorEmail=email; document.getElementById("modalOverlay").style.display="flex"; }
function closeModal() { document.getElementById("modalOverlay").style.display="none"; }
function openSuccess() { document.getElementById("successOverlay").style.display="flex"; }
function closeSuccess() { document.getElementById("successOverlay").style.display="none"; goToPage("page1"); }

// -------------------
// Submit Message
// -------------------
async function submitMessage() {
  const firstName=document.getElementById("firstName")?.value.trim();
  const lastName=document.getElementById("lastName")?.value.trim();
  const grade=document.getElementById("studentGrade")?.value.trim();
  const studentId=document.getElementById("studentId")?.value.trim();
  const notes=document.getElementById("extraNotes")?.value.trim();

  if(!firstName || !lastName || !grade || !studentId){ alert("Please fill in all required fields."); return; }

  // ------------------- SIS Verification
  try {
    const res = await fetch("/api/verifyStudent",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ student_id: studentId })
    });
    const verify = await res.json();
    if(!verify.valid){ alert("Student not recognized."); return; }
  } catch(err){ console.error(err); alert("Verification failed."); return; }

  const entry={
    student_id: studentId,
    firstName,
    lastName,
    grade,
    notes,
    reason:selectedReason,
    urgency:selectedUrgency,
    counselor:selectedCounselor,
    counselorEmail:selectedCounselorEmail,
    dateTime:new Date().toISOString()
  };

  try {
    // ✅ Crisis messages go to API (admin + counselor)
    if(selectedUrgency==="I’m in Crisis"){
      await fetch("/api/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(entry)
      });
    } else {
      console.log("Non-crisis message stored locally:", entry);
    }

    // Save locally for student
    const existing = JSON.parse(localStorage.getItem("studentMessages")||"[]");
    existing.push(entry);
    localStorage.setItem("studentMessages", JSON.stringify(existing));

    closeModal(); openSuccess();

    // Reset selections
    selectedReason = ""; selectedUrgency = ""; selectedCounselor = ""; selectedCounselorEmail = "";
    ["firstName","lastName","studentGrade","studentId","extraNotes"].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=""; });

  } catch(err){ console.error(err); alert("Failed to send message."); }
}

// -------------------
// Init
// -------------------
window.onload = () => {};
</script>

</body>
</html>
