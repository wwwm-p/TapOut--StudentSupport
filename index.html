<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapOut! Student Support</title>

<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/student-manifest.json">
<meta name="theme-color" content="#0070c9">
<link rel="apple-touch-icon" href="/icons/icon-192-student.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TapOut! Student Support">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{overflow-x:hidden;}
.page{display:none;position:relative;}
.page.active{display:block;text-align:center;}
.page img{width:100%;height:auto;}
.hotspot{position:absolute;z-index:10;cursor:pointer;}
.back-button{margin-top:10px;padding:8px 12px;border-radius:12px;border:none;cursor:pointer;background:#ccc;}
.counselor-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;}
.counselor-grid button{padding:8px 12px;border-radius:12px;border:none;background:#0070c9;color:white;cursor:pointer;}
.install-btn{padding:6px 10px;border-radius:6px;border:1px solid #0070c9;background:#0070c9;color:white;cursor:pointer;display:none;position:fixed;bottom:20px;right:20px;z-index:1000;}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px 24px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:100;}
.top-bar .app-name{font-weight:bold;font-size:1.2em;}
.top-bar .top-actions{display:flex;gap:16px;align-items:center;}
.dark-toggle{padding:6px 10px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer;}
body.dark .dark-toggle{background:#111827;color:#e5e7eb;border-color:#1f2937;}
</style>
</head>
<body>

<div class="top-bar">
  <div class="app-name">TapOut! Student Support</div>
  <div class="top-actions">
    <button class="dark-toggle" id="darkToggle">Dark Mode</button>
    <button class="install-btn" id="installBtn">Install App</button>
  </div>
</div>

<div class="page active" id="page1">
  <img src="/page1.png" alt="Welcome Page">
  <!-- Hotspots -->
</div>
<div class="page" id="page2">
  <img src="/page2.png" alt="Urgency Page">
  <button class="back-button" onclick="goToPage('page1')">Back</button>
</div>
<div class="page" id="page3">
  <img src="/page3.png" alt="Counselor Page">
  <div class="counselor-grid" id="counselorGrid"></div>
  <button class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<script>
let selectedReason="", selectedUrgency="";

function goToPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id)?.classList.add("active");
}

document.getElementById("darkToggle").onclick = ()=>document.body.classList.toggle("dark");

// Service Worker
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/service-worker.js")
    .then(()=>console.log("SW registered"))
    .catch(err=>console.warn("SW registration failed:", err));
}

// Install Button
let deferredPrompt;
const installBtn = document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "inline-block";
});
installBtn.addEventListener("click", async ()=>{
  installBtn.style.display="none";
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choice=>console.log('User choice:', choice.outcome));
    deferredPrompt = null;
  }
});

// Populate example counselors
function populateStudentCounselorDropdown(){
  const counselors=[{username:"c1",email:"c1@example.com"}];
  const grid=document.getElementById("counselorGrid");
  grid.innerHTML='';
  counselors.forEach(c=>{
    const btn=document.createElement("button");
    btn.textContent=c.email;
    btn.onclick=()=>console.log("Open modal for", c.username,c.email);
    grid.appendChild(btn);
  });
}
window.addEventListener("load", populateStudentCounselorDropdown);
</script>
</body>
</html>
