<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapOut! – Student</title>

<link rel="stylesheet" href="style.css">

<!-- PWA -->
<link rel="manifest" href="./student-manifest.json">
<meta name="theme-color" content="#0070c9">
<meta name="description" content="Student support app to connect with counselors quickly">

<link rel="apple-touch-icon" href="icons/icon-192-student.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TapOut">

<style>
/* (your styles unchanged) */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{overflow-x:hidden;}
.page{display:none;position:relative;}
.page.active{display:block;text-align:center;}
.page img{width:100%;height:auto;display:block;}
.hotspot{position:absolute;z-index:10;cursor:pointer;}
.back-button{margin-top:10px;padding:8px 12px;border-radius:12px;border:none;cursor:pointer;background:#ccc;}
.counselor-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;}
.counselor-grid button{padding:8px 12px;border-radius:12px;border:none;background:#0070c9;color:white;cursor:pointer;}
.install-btn{padding:6px 10px;border-radius:6px;border:1px solid #0070c9;background:#0070c9;color:white;cursor:pointer;display:none;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:999;}
.modal-overlay.active{display:flex;}
.modal{background:#fff;max-width:560px;width:90%;padding:20px;border-radius:12px;text-align:left;}
.crisis-list{list-style:none;padding:0;margin:12px 0;line-height:1.4;}
.crisis-section{margin-bottom:12px;}
.crisis-actions{display:flex;gap:10px;justify-content:flex-end;}
.crisis-actions .primary{background:#0070c9;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;}
.crisis-actions .secondary{background:#eee;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;}
</style>
</head>

<body>

<div style="padding:10px;text-align:center;">
  <button class="install-btn" id="installBtn">Install App</button>
</div>

<!-- (your pages unchanged) -->
<!-- KEEP ALL YOUR EXISTING HTML EXACTLY AS IS BELOW -->

<script>
let selectedReason="", selectedUrgency="";

/* NAVIGATION */
function goToPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  const page=document.getElementById(id);
  if(page) page.classList.add("active");
}
function chooseReason(reason){
  selectedReason=reason;
  goToPage('page2');
}
function chooseUrgency(urgency){
  selectedUrgency=urgency;
  if(urgency==="I’m in Crisis"){openCrisisModal();}
  else{goToPage('page3');}
}

/* MODAL */
function openCrisisModal(){document.getElementById('crisisOverlay').classList.add('active');}
function closeCrisisModal(){document.getElementById('crisisOverlay').classList.remove('active');}
function continueFromCrisis(){closeCrisisModal(); goToPage('page3');}

/* SERVICE WORKER (improved) */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg=>console.log('SW registered:',reg.scope))
      .catch(err=>console.error('SW failed:',err));
  });
}

/* INSTALL BUTTON */
let deferredPrompt;
const installBtn=document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt=e;
  installBtn.style.display='inline-block';
});

installBtn.addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  installBtn.style.display='none';
});

/* iOS INSTALL TIP */
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function isStandalone(){
  return window.navigator.standalone;
}
if(isIOS() && !isStandalone()){
  const div=document.createElement("div");
  div.innerHTML="Tap Share → Add to Home Screen";
  div.style.background="#0070c9";
  div.style.color="#fff";
  div.style.padding="8px";
  div.style.textAlign="center";
  document.body.prepend(div);
}

/* COUNSELORS */
const exampleCounselors=[
  {username:'c1',email:'counselor1@example.com'},
  {username:'c2',email:'counselor2@example.com'}
];

function populateStudentCounselorDropdown(){
  const grid=document.getElementById('counselorGrid');
  grid.innerHTML='';
  exampleCounselors.forEach(c=>{
    const btn=document.createElement('button');
    btn.textContent=c.email;
    btn.onclick=()=>console.log(c);
    grid.appendChild(btn);
  });
}
window.addEventListener('load', populateStudentCounselorDropdown);
</script>

</body>
</html>
