<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapOut! – Student</title>

<link rel="stylesheet" href="style.css">

<!-- PWA -->
<link rel="manifest" href="/student-manifest.json">
<meta name="theme-color" content="#0070c9">
<link rel="apple-touch-icon" href="/icons/icon-192-student.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TapOut! – Student">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{overflow-x:hidden;}
.page{display:none;position:relative;}
.page.active{display:block;text-align:center;}
.page img{width:100%;height:auto;display:block;}
.hotspot{position:absolute;z-index:10;cursor:pointer;background:transparent;border:none;}
.back-button{margin-top:10px;padding:8px 12px;border-radius:12px;border:none;cursor:pointer;background:#ccc;}
.counselor-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;}
.counselor-grid button{padding:8px 12px;border-radius:12px;border:none;background:#0070c9;color:white;cursor:pointer;}
.install-btn{padding:6px 10px;border-radius:6px;border:1px solid #0070c9;background:#0070c9;color:white;cursor:pointer;display:none;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:999;}
.modal-overlay.active{display:flex;}
.modal{background:#fff;max-width:560px;width:90%;padding:20px;border-radius:12px;text-align:left;}
.crisis-list{list-style:none;padding:0;margin:12px 0;line-height:1.4;}
.crisis-section{margin-bottom:12px;}
.crisis-actions{display:flex;gap:10px;justify-content:flex-end;}
.crisis-actions .primary{background:#0070c9;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;}
.crisis-actions .secondary{background:#eee;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;}
</style>
</head>
<body>

<!-- Install button -->
<div style="padding:10px;text-align:center;">
  <button class="install-btn" id="installBtn">Install App</button>
</div>

<!-- Pages -->
<div class="page active" id="page1">
  <img src="page1.png" alt="Welcome Page">
  <div id="hotspotContainerPage1"></div>
</div>

<div class="page" id="page2">
  <img src="page2.png" alt="Urgency Page">
  <div id="hotspotContainerPage2"></div>
  <button class="back-button" onclick="goToPage('page1')">Back</button>
</div>

<div class="page" id="page3">
  <img src="page3.png" alt="Counselor Page">
  <div class="counselor-grid" id="counselorGrid"></div>
  <div id="appointmentContainer"></div>
  <div id="notesContainer"></div>
  <button class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<!-- Crisis Modal -->
<div class="modal-overlay" id="crisisOverlay">
  <div class="modal crisis-modal">
    <h2>Immediate Support</h2>
    <ul class="crisis-list" id="crisisList"></ul>
    <div class="crisis-actions">
      <button type="button" class="secondary" onclick="closeCrisisModal()">Close</button>
      <button type="button" class="primary" onclick="continueFromCrisis()">Continue</button>
    </div>
  </div>
</div>

<script>
let selectedReason = "", selectedUrgency = "";

/* ---------------- NAVIGATION ---------------- */
function goToPage(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id)?.classList.add("active");
}
function chooseReason(reason){ selectedReason = reason; goToPage('page2'); }
function chooseUrgency(urgency){
  selectedUrgency = urgency;
  urgency === "I’m in Crisis" ? openCrisisModal() : goToPage('page3');
}

/* ---------------- CRISIS MODAL ---------------- */
function openCrisisModal(){ document.getElementById("crisisOverlay")?.classList.add("active"); }
function closeCrisisModal(){ document.getElementById("crisisOverlay")?.classList.remove("active"); }
function continueFromCrisis(){ closeCrisisModal(); goToPage('page3'); }

function populateCrisisList(crisisData){
  const list = document.getElementById('crisisList');
  list.innerHTML = '';
  crisisData.forEach(c => {
    const li = document.createElement('li');
    li.className = 'crisis-section';
    li.innerHTML = `<strong>${c.title}</strong><br>${c.info}`;
    list.appendChild(li);
  });
}

/* ---------------- SERVICE WORKER ---------------- */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/service-worker.js")
    .then(()=>console.log("SW registered"))
    .catch(err=>console.warn("SW registration failed:", err));
}

/* ---------------- INSTALL BUTTON ---------------- */
let deferredPrompt;
const installBtn = document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  deferredPrompt = e;
  if(installBtn) installBtn.style.display = 'inline-block';
});
if(installBtn){
  installBtn.addEventListener("click", async ()=>{
    installBtn.style.display = 'none';
    if(deferredPrompt){
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      console.log('User choice:', choice.outcome);
      deferredPrompt = null;
    }
  });
}

/* ---------------- DYNAMIC HOTSPOTS ---------------- */
function createHotspots(containerId, hotspots){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  hotspots.forEach(h => {
    const btn = document.createElement('button');
    btn.className = `hotspot ${h.class}`;
    btn.style.position = 'absolute';
    btn.style.top = h.top;
    btn.style.left = h.left;
    btn.style.width = h.width;
    btn.style.height = h.height;
    btn.onclick = h.onClick;  // All buttons are enabled
    container.appendChild(btn);
  });
}

/* Example hotspots for page1 and page2 (all enabled) */
createHotspots('hotspotContainerPage1', [
  {class:'academic', top:'10%', left:'10%', width:'15%', height:'10%', onClick:()=>chooseReason('Academic stress')},
  {class:'anxiety', top:'25%', left:'10%', width:'15%', height:'10%', onClick:()=>chooseReason('Anxiety')},
  {class:'depression', top:'40%', left:'10%', width:'15%', height:'10%', onClick:()=>chooseReason('Depression')},
  {class:'family', top:'55%', left:'10%', width:'15%', height:'10%', onClick:()=>chooseReason('Family issues')},
  {class:'relationship', top:'70%', left:'10%', width:'15%', height:'10%', onClick:()=>chooseReason('Relationship problems')},
  {class:'bullying', top:'85%', left:'10%', width:'15%', height:'10%', onClick:()=>chooseReason('Bullying')},
  {class:'talk', top:'10%', left:'30%', width:'15%', height:'10%', onClick:()=>chooseReason('Just need to talk')},
  {class:'unsure', top:'25%', left:'30%', width:'15%', height:'10%', onClick:()=>chooseReason('Not ready to say')}
]);

createHotspots('hotspotContainerPage2', [
  {class:'fine', top:'10%', left:'10%', width:'15%', height:'10%', onClick:()=>chooseUrgency('I’m Doing Fine')},
  {class:'littleoff', top:'25%', left:'10%', width:'15%', height:'10%', onClick:()=>chooseUrgency('Feeling a Little Off')},
  {class:'coping', top:'40%', left:'10%', width:'15%', height:'10%', onClick:()=>chooseUrgency('Not Coping Well')},
  {class:'crisis', top:'55%', left:'10%', width:'15%', height:'10%', onClick:()=>chooseUrgency('I’m in Crisis')}
]);

/* ---------------- DYNAMIC COUNSELORS ---------------- */
async function loadCounselors(){
  const grid = document.getElementById('counselorGrid');
  grid.innerHTML = '';
  try {
    const counselors = [
      {id:1, name:'Alice', email:'alice@example.com'},
      {id:2, name:'Bob', email:'bob@example.com'}
    ];
    counselors.forEach(c => {
      const btn = document.createElement('button');
      btn.textContent = c.email;
      btn.onclick = ()=>loadStudentData(c.id);
      grid.appendChild(btn);
    });
  } catch(err){
    grid.innerHTML = '<p>Error loading counselors</p>';
    console.error(err);
  }
}

/* ---------------- DYNAMIC APPOINTMENTS / NOTES ---------------- */
function loadStudentData(counselorId){
  const appointmentContainer = document.getElementById('appointmentContainer');
  const notesContainer = document.getElementById('notesContainer');

  const appointments = [
    {id:1, date:'2026-03-22', topic:'Stress check-in'},
    {id:2, date:'2026-03-23', topic:'Homework help'}
  ];
  const notes = [
    {id:1, text:'Student reported feeling anxious.'},
    {id:2, text:'Follow-up on family discussion.'}
  ];

  appointmentContainer.innerHTML = `<h3>Appointments</h3><ul>${appointments.map(a=>`<li>${a.date}: ${a.topic}</li>`).join('')}</ul>`;
  notesContainer.innerHTML = `<h3>Notes</h3><ul>${notes.map(n=>`<li>${n.text}</li>`).join('')}</ul>`;
}

/* ---------------- DYNAMIC CRISIS DATA ---------------- */
const exampleCrisis = [
  {title:'Emergency', info:'Call 911 for life-threatening crises'},
  {title:'Suicide & Crisis', info:'Call or text 988 (24/7, free, confidential)'},
  {title:'Eating Disorder', info:'Text NEDA to 741741 or call 1-800-931-2237'},
  {title:'Domestic Violence', info:'Call 1-800-799-7233 or text START to 88788'},
  {title:'Sexual Assault', info:'Call 1-800-656-4673'},
  {title:'Substance Abuse', info:'Call 1-800-662-4357'},
  {title:'LGBTQ Youth', info:'Call 1-866-488-7386 or text START to 678-678'}
];
populateCrisisList(exampleCrisis);

/* ---------------- INIT ---------------- */
window.addEventListener('load', () => {
  loadCounselors();
});
</script>
</body>
</html>
