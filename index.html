<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Support</title>

<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}

/* PAGES */
.page{
display:none;
text-align:center;
position:relative;
width:100%;
}
.page.active{
display:block;
}
.page img{
width:100%;
height:auto;
display:block;
}

/* HOTSPOT BUTTONS */
.hotspot{
position:absolute;
border:none;
background:rgba(0,0,0,0);
cursor:pointer;
z-index:2;
}

/* Example hotspot positions */
#page1 .academic { top:20%; left:10%; width:45px; height:45px; }
#page1 .anxiety { top:30%; left:10%; width:45px; height:45px; }
#page1 .depression { top:40%; left:10%; width:45px; height:45px; }
#page1 .family { top:50%; left:10%; width:45px; height:45px; }
#page1 .relationships { top:60%; left:10%; width:45px; height:45px; }
#page1 .bullying { top:70%; left:10%; width:45px; height:45px; }
#page1 .talk { top:80%; left:10%; width:45px; height:45px; }
#page1 .notready { top:90%; left:10%; width:45px; height:45px; }

#page2 .fine { top:25%; left:10%; width:45px; height:45px; }
#page2 .littleoff { top:40%; left:10%; width:45px; height:45px; }
#page2 .coping { top:55%; left:10%; width:45px; height:45px; }
#page2 .crisis { top:70%; left:10%; width:45px; height:45px; }

/* MODALS */
.modal-overlay{
position:fixed;
inset:0;
background:rgba(15,23,42,.55);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
backdrop-filter:blur(6px);
}
.modal{
width:360px;
background:white;
padding:26px;
border-radius:18px;
text-align:center;
box-shadow:0 24px 60px rgba(0,0,0,.22);
border:1px solid #eef2f7;
}
.modal h2{
margin:0 0 14px;
font-size:20px;
font-weight:700;
}
.modal input,
.modal textarea{
width:100%;
margin-bottom:12px;
padding:11px;
border-radius:12px;
border:1px solid #e6e8ec;
background:#f9fafb;
text-align:center;
}
.modal textarea{
height:90px;
resize:none;
}
.modal-buttons{
display:flex;
gap:12px;
justify-content:center;
}
.modal-buttons button{
padding:9px 18px;
border-radius:999px;
border:none;
cursor:pointer;
}
.modal-buttons button:first-child{
background:#f1f5f9;
}
.modal-buttons button:last-child{
background:#0070c9;
color:white;
}

/* COUNSELOR GRID */
.counselor-grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin-top:20px;
}
.counselor-grid button{
padding:10px 14px;
border-radius:12px;
border:none;
background:#0070c9;
color:white;
cursor:pointer;
}

/* BACK BUTTON */
.back-button{
margin-top:16px;
padding:10px 14px;
border-radius:12px;
border:none;
background:#d1d5db;
cursor:pointer;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
<img src="page1.png" alt="Page 1">
<button class="hotspot academic" onclick="chooseReason('Academic Stress')"></button>
<button class="hotspot anxiety" onclick="chooseReason('Anxiety or Panic Attacks')"></button>
<button class="hotspot depression" onclick="chooseReason('Depression or Sadness')"></button>
<button class="hotspot family" onclick="chooseReason('Family Issues')"></button>
<button class="hotspot relationships" onclick="chooseReason('Relationship Problems')"></button>
<button class="hotspot bullying" onclick="chooseReason('Bullying')"></button>
<button class="hotspot talk" onclick="chooseReason('Just Need Someone To Talk To')"></button>
<button class="hotspot notready" onclick="chooseReason('Not Ready To Say')"></button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
<img src="page2.png" alt="Page 2">
<button class="hotspot fine" onclick="chooseUrgency('I’m Doing Fine – Just Curious')"></button>
<button class="hotspot littleoff" onclick="chooseUrgency('Feeling a Little Off')"></button>
<button class="hotspot coping" onclick="chooseUrgency('I’m Not Coping Well')"></button>
<button class="hotspot crisis" onclick="chooseUrgency('I’m in Crisis')"></button>
<button class="back-button" onclick="goToPage('page1')">Back</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
<h2>Select Counselor</h2>
<div class="counselor-grid">
<button onclick="openModal('counselor1','counselor1@example.com')">counselor1@example.com</button>
<button onclick="openModal('counselor2','counselor2@example.com')">counselor2@example.com</button>
<button onclick="openModal('counselor3','counselor3@example.com')">counselor3@example.com</button>
<button onclick="openModal('counselor4','counselor4@example.com')">counselor4@example.com</button>
<button onclick="openModal('counselor5','counselor5@example.com')">counselor5@example.com</button>
<button onclick="openModal('counselor6','counselor6@example.com')">counselor6@example.com</button>
</div>
<button class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<!-- STUDENT MODAL -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h2>Submit Message</h2>
<input id="firstName" placeholder="First Name">
<input id="lastName" placeholder="Last Name">
<input id="studentGrade" placeholder="Grade">
<input id="studentId" placeholder="Student ID">
<textarea id="extraNotes" placeholder="Additional notes"></textarea>
<div class="modal-buttons">
<button onclick="closeModal()">Cancel</button>
<button onclick="submitMessage()">Submit</button>
</div>
</div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal-overlay" id="successOverlay">
<div class="modal">
<h2>Message Sent</h2>
<button onclick="closeSuccess()">OK</button>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
