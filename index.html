<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapOut! – Student</title>

<link rel="stylesheet" href="style.css">

<!-- PWA -->
<link rel="manifest" href="/student-manifest.json">
<meta name="theme-color" content="#0070c9">
<link rel="apple-touch-icon" href="/icons/icon-192-student.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TapOut! – Student">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{overflow-x:hidden;}
.page{display:none;position:relative;}
.page.active{display:block;text-align:center;}
.page img{width:100%;height:auto;display:block;}
.hotspot{position:absolute;z-index:10;cursor:pointer;}
.back-button{margin-top:10px;padding:8px 12px;border-radius:12px;border:none;cursor:pointer;background:#ccc;}
.counselor-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;}
.counselor-grid button{padding:8px 12px;border-radius:12px;border:none;background:#0070c9;color:white;cursor:pointer;}
.install-btn{padding:6px 10px;border-radius:6px;border:1px solid #0070c9;background:#0070c9;color:white;cursor:pointer;display:none;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:999;}
.modal-overlay.active{display:flex;}
.modal{background:#fff;max-width:560px;width:90%;padding:20px;border-radius:12px;text-align:left;}
.crisis-list{list-style:none;padding:0;margin:12px 0;line-height:1.4;}
.crisis-section{margin-bottom:12px;}
.crisis-actions{display:flex;gap:10px;justify-content:flex-end;}
.crisis-actions .primary{background:#0070c9;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;}
.crisis-actions .secondary{background:#eee;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;}
</style>
</head>
<body>

<!-- Install button -->
<div style="padding:10px;text-align:center;">
  <button class="install-btn" id="installBtn">Install App</button>
</div>

<div class="page active" id="page1">
  <img src="page1.png">
</div>

<div class="page" id="page2">
  <img src="page2.png">
  <button class="back-button" onclick="goToPage('page1')">Back</button>
</div>

<div class="page" id="page3">
  <img src="page3.png">
  <div class="counselor-grid" id="counselorGrid"></div>
  <button class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<!-- CRISIS MODAL -->
<div class="modal-overlay" id="crisisOverlay">
  <div class="modal">
    <h2>Immediate Support</h2>
    <p>If you're in danger, call 911 or 988.</p>
    <div class="crisis-actions">
      <button class="secondary" onclick="closeCrisisModal()">Close</button>
      <button class="primary" onclick="continueFromCrisis()">Continue</button>
    </div>
  </div>
</div>

<script>
let selectedReason="", selectedUrgency="";

/* NAVIGATION */
function goToPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id)?.classList.add("active");
}

/* CRISIS */
function openCrisisModal(){ document.getElementById("crisisOverlay").classList.add("active"); }
function closeCrisisModal(){ document.getElementById("crisisOverlay").classList.remove("active"); }
function continueFromCrisis(){ closeCrisisModal(); goToPage("page3"); }

/* 🔥 SERVICE WORKER FIX */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js").then(reg => {
    console.log("SW registered");

    // FORCE CONTROL (THIS FIXES INSTALL BUTTON ISSUE)
    if (!navigator.serviceWorker.controller) {
      window.location.reload();
    }
  }).catch(err => console.warn("SW failed:", err));
}

/* INSTALL BUTTON */
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "inline-block";
});

installBtn.addEventListener("click", async ()=>{
  installBtn.style.display="none";
  if(deferredPrompt){
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    console.log("User choice:", choice.outcome);
    deferredPrompt = null;
  }
});

/* COUNSELORS */
function populateStudentCounselorDropdown(){
  const counselors=[{username:"c1",email:"c1@example.com"}];
  const grid=document.getElementById("counselorGrid");
  grid.innerHTML='';
  counselors.forEach(c=>{
    const btn=document.createElement("button");
    btn.textContent=c.email;
    grid.appendChild(btn);
  });
}

window.addEventListener("load", populateStudentCounselorDropdown);
</script>

</body>
</html>
