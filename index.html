<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapOut! – Student</title>

<link rel="stylesheet" href="style.css">

<!-- PWA -->
<link rel="manifest" href="./student-manifest.json">
<meta name="theme-color" content="#0070c9">

<!-- iOS support -->
<link rel="apple-touch-icon" href="./icons/icon-192-student.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TapOut! – Student">

<style>
/* (your styles unchanged) */
</style>
</head>
<body>

<div style="padding:10px;text-align:center;">
  <button class="install-btn" id="installBtn">Install App</button>
</div>

<!-- PAGES (unchanged) -->
<!-- KEEP YOUR EXISTING HTML EXACTLY HERE -->

<script>
let selectedReason = "", selectedUrgency = "";

/* NAVIGATION */
function goToPage(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  const page = document.getElementById(id);
  if(page) page.classList.add("active");
}

function chooseReason(reason){
  selectedReason = reason;
  goToPage('page2');
}

function chooseUrgency(urgency){
  selectedUrgency = urgency;
  if(urgency === "I’m in Crisis"){
    openCrisisModal();
  } else {
    goToPage('page3');
  }
}

/* CRISIS MODAL */
function openCrisisModal(){
  document.getElementById('crisisOverlay').classList.add('active');
}

function closeCrisisModal(){
  document.getElementById('crisisOverlay').classList.remove('active');
}

function continueFromCrisis(){
  closeCrisisModal();
  goToPage('page3');
}

/* ✅ SERVICE WORKER (IMPROVED) */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.error('SW failed:', err));
  });
}

/* ✅ INSTALL BUTTON (FIXED) */
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block';
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const choice = await deferredPrompt.userChoice;
  console.log('Install result:', choice.outcome);
  deferredPrompt = null;
  installBtn.style.display = 'none';
});

/* COUNSELORS */
const exampleCounselors = [
  { username: 'counselor1', email: 'counselor1@example.com' },
  { username: 'counselor2', email: 'counselor2@example.com' }
];

function populateStudentCounselorDropdown(){
  const grid = document.getElementById('counselorGrid');
  grid.innerHTML = '';

  exampleCounselors.forEach(c => {
    const btn = document.createElement('button');
    btn.textContent = c.email;
    btn.onclick = () => alert(`Selected: ${c.email}`);
    grid.appendChild(btn);
  });
}

window.addEventListener('load', populateStudentCounselorDropdown);
</script>

</body>
</html>
