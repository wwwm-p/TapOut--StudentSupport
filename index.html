<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TapOut! Student Support</title>

  <link rel="stylesheet" href="/style.css" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/student-manifest.json" />
  <meta name="theme-color" content="#0070c9" />
  <meta name="background-color" content="#ffffff" />
  <meta name="application-name" content="TapOut! Student Support" />

  <!-- Apple / iOS -->
  <link rel="apple-touch-icon" href="/icons/icon-192-student.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TapOut! Student Support" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { overflow-x: hidden; background: #fff; color: #111; }
    body.dark { background: #0b1220; color: #e5e7eb; }
    .page { display: none; position: relative; }
    .page.active { display: block; text-align: center; }
    .page img { width: 100%; height: auto; display: block; }
    .hotspot { position: absolute; z-index: 10; cursor: pointer; background: transparent; border: 0; }
    .back-button { margin-top: 10px; padding: 8px 12px; border-radius: 12px; border: none; cursor: pointer; background: #ccc; }
    body.dark .back-button { background: #1f2937; color: #e5e7eb; }
    .counselor-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; padding: 0 12px; }
    .counselor-grid button { padding: 8px 12px; border-radius: 12px; border: none; background: #0070c9; color: white; cursor: pointer; }
    .install-btn { padding: 6px 10px; border-radius: 6px; border: 1px solid #0070c9; background: #0070c9; color: white; cursor: pointer; display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 24px; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
    body.dark .top-bar { background: #0b1220; border-color: #1f2937; }
    .top-bar .app-name { font-weight: bold; font-size: 1.2em; }
    .top-bar .top-actions { display: flex; gap: 16px; align-items: center; }
    .dark-toggle { padding: 6px 10px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
    body.dark .dark-toggle { background: #111827; color: #e5e7eb; border-color: #1f2937; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  </style>
</head>
<body>
  <noscript>Your browser needs JavaScript enabled to use this app.</noscript>

  <div class="top-bar">
    <div class="app-name">TapOut! Student Support</div>
    <div class="top-actions">
      <button class="dark-toggle" id="darkToggle" type="button">Dark Mode</button>
      <button class="install-btn" id="installBtn" type="button">Install App</button>
    </div>
  </div>

  <div class="page active" id="page1" aria-live="polite">
    <img src="/page1.png" alt="Welcome Page" />
    <button class="hotspot academic" type="button" data-reason="Academic stress or pressure" aria-label="Academic stress or pressure"></button>
    <button class="hotspot anxiety" type="button" data-reason="Anxiety or panic attacks" aria-label="Anxiety or panic attacks"></button>
    <button class="hotspot depression" type="button" data-reason="Depression or sadness" aria-label="Depression or sadness"></button>
    <button class="hotspot family" type="button" data-reason="Family issues or home stress" aria-label="Family issues or home stress"></button>
    <button class="hotspot relationship" type="button" data-reason="Relationship or friendship problems" aria-label="Relationship or friendship problems"></button>
    <button class="hotspot bullying" type="button" data-reason="Bullying or harassment" aria-label="Bullying or harassment"></button>
    <button class="hotspot talk" type="button" data-reason="I just need someone to talk to" aria-label="I just need someone to talk to"></button>
    <button class="hotspot unsure" type="button" data-reason="I'm not ready to say" aria-label="I'm not ready to say"></button>
  </div>

  <div class="page" id="page2">
    <img src="/page2.png" alt="Urgency Page" />
    <button class="hotspot fine" type="button" data-urgency="I'm Doing Fine – Just Curious" aria-label="I'm Doing Fine – Just Curious"></button>
    <button class="hotspot littleoff" type="button" data-urgency="Feeling a Little Off" aria-label="Feeling a Little Off"></button>
    <button class="hotspot coping" type="button" data-urgency="I'm Not Coping Well" aria-label="I'm Not Coping Well"></button>
    <button class="hotspot crisis" type="button" data-urgency="I'm in Crisis" aria-label="I'm in Crisis"></button>
    <button class="back-button" type="button" data-back="page1">Back</button>
  </div>

  <div class="page" id="page3">
    <img src="/page3.png" alt="Counselor Page" />
    <div class="counselor-grid" id="counselorGrid"></div>
    <button class="back-button" type="button" data-back="page2">Back</button>
  </div>

  <script>
    let selectedReason = "";
    let selectedUrgency = "";

    function goToPage(id) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      const target = document.getElementById(id);
      if (target) target.classList.add("active");
    }

    function chooseReason(reason) {
      selectedReason = reason;
      goToPage("page2");
    }

    function chooseUrgency(urgency) {
      selectedUrgency = urgency;
      if (urgency === "I'm in Crisis") {
        openCrisisModal();
      } else {
        goToPage("page3");
      }
    }

    function openCrisisModal() {
      console.log("Crisis modal");
      // TODO: implement crisis modal UI
    }

    // Dark mode
    document.getElementById("darkToggle").addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });

    // Hotspot handlers
    document.querySelectorAll("[data-reason]").forEach(btn => {
      btn.addEventListener("click", () => chooseReason(btn.dataset.reason));
    });
    document.querySelectorAll("[data-urgency]").forEach(btn => {
      btn.addEventListener("click", () => chooseUrgency(btn.dataset.urgency));
    });
    document.querySelectorAll("[data-back]").forEach(btn => {
      btn.addEventListener("click", () => goToPage(btn.dataset.back));
    });

    // Service worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js", { scope: "/" })
          .then(() => console.log("SW registered"))
          .catch(err => console.warn("SW registration failed:", err));
      });
    }

    // Install button
    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-block";
    });

    installBtn.addEventListener("click", async () => {
      installBtn.style.display = "none";
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        console.log("User choice:", choice.outcome);
        deferredPrompt = null;
      }
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    // Populate counselors
    async function populateStudentCounselorDropdown() {
      const counselors = [{ username: "counselor1", email: "counselor1@example.com" }];
      const grid = document.getElementById("counselorGrid");
      grid.innerHTML = "";
      counselors.forEach(c => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = c.email;
        btn.addEventListener("click", () => console.log("Open modal for", c.username, c.email));
        grid.appendChild(btn);
      });
    }

    window.addEventListener("load", populateStudentCounselorDropdown);
  </script>
</body>
</html>
