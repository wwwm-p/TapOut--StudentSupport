<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Support</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; font-family:sans-serif; }

/* Pages */
.page { display: none; position: relative; text-align: center; max-width: 600px; margin: 0 auto; }
.page.active { display: block; }
.page img { width: 100%; display: block; }

/* Hotspot buttons inside page container */
.hotspot {
  position: absolute;
  border: none;
  background: rgba(0,0,0,0);
  cursor: pointer;
}

/* Example positions (adjust top/left/width/height as needed for your images) */
#page1 .hotspot.academic { top:20%; left:10%; width:45px; height:45px; }
#page1 .hotspot.anxiety { top:30%; left:10%; width:45px; height:45px; }
#page1 .hotspot.depression { top:40%; left:10%; width:45px; height:45px; }
#page1 .hotspot.family { top:50%; left:10%; width:45px; height:45px; }
#page1 .hotspot.relationship { top:60%; left:10%; width:45px; height:45px; }
#page1 .hotspot.bullying { top:70%; left:10%; width:45px; height:45px; }
#page1 .hotspot.talk { top:80%; left:10%; width:45px; height:45px; }
#page1 .hotspot.unsure { top:90%; left:10%; width:45px; height:45px; }

#page2 .hotspot.fine { top:25%; left:10%; width:45px; height:45px; }
#page2 .hotspot.littleoff { top:40%; left:10%; width:45px; height:45px; }
#page2 .hotspot.coping { top:55%; left:10%; width:45px; height:45px; }
#page2 .hotspot.crisis { top:70%; left:10%; width:45px; height:45px; }

.back-button { margin:10px auto; padding:8px 18px; border:none; border-radius:999px; background:#f1f5f9; color:#334155; cursor:pointer; display:block; }

/* Modal Styles */
.modal-overlay { position: fixed; inset:0; display:none; justify-content:center; align-items:center; background: rgba(15,23,42,0.55); backdrop-filter: blur(6px); z-index:1000; }
.modal { width: 360px; padding:28px; background:#fff; border-radius:18px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,0.22); border:1px solid #eef2f7; }
.modal h2 { margin-bottom:14px; font-size:20px; font-weight:700; color:#0f172a; }
.modal input, .modal textarea { width:100%; padding:11px; margin-bottom:12px; border-radius:12px; border:1px solid #e6e8ec; background:#f9fafb; text-align:center; font-size:14px; }
.modal input:focus, .modal textarea:focus { outline:none; border:1px solid #0070c9; box-shadow:0 0 0 3px rgba(0,112,201,0.2); background:#fff; }
.modal textarea { height:90px; resize:none; }
.modal-buttons { display:flex; justify-content:center; gap:12px; margin-top:6px; }
.modal-buttons button:first-child { background:#f1f5f9; color:#334155; }
.modal-buttons button:last-child { background:#0070c9; color:#fff; }

/* Success Modal */
.success-modal { width:320px; }
.success-icon { width:56px; height:56px; border-radius:50%; background:#16a34a; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; margin:4px auto 10px; }
.success-text { font-size:18px; font-weight:700; color:#0f172a; margin-bottom:10px; }
.success-actions button { padding:10px 18px; border-radius:999px; border:none; background:#0070c9; color:#fff; cursor:pointer; font-size:14px; font-weight:600; }

/* Crisis Modal */
.crisis-modal { width:min(560px,92vw); text-align:left; }
.crisis-list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; font-size:14px; color:#0f172a; }
.crisis-list strong { display:block; font-size:15px; }
.crisis-section { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; }
.crisis-actions { display:flex; justify-content:center; gap:12px; margin-top:14px; }
.crisis-actions .secondary { background:#f1f5f9; color:#334155; }
.crisis-actions .primary { background:#0070c9; color:#fff; }
</style>
</head>
<body>

<!-- Page 1 -->
<div class="page active" id="page1">
  <img src="page1.png" alt="Page 1">
  <button class="hotspot academic" onclick="chooseReason('Academic stress or pressure')"></button>
  <button class="hotspot anxiety" onclick="chooseReason('Anxiety or panic attacks')"></button>
  <button class="hotspot depression" onclick="chooseReason('Depression or sadness')"></button>
  <button class="hotspot family" onclick="chooseReason('Family issues or home stress')"></button>
  <button class="hotspot relationship" onclick="chooseReason('Relationship or friendship problems')"></button>
  <button class="hotspot bullying" onclick="chooseReason('Bullying or harassment')"></button>
  <button class="hotspot talk" onclick="chooseReason('I just need someone to talk to')"></button>
  <button class="hotspot unsure" onclick="chooseReason('I’m not ready to say')"></button>
</div>

<!-- Page 2 -->
<div class="page" id="page2">
  <img src="page2.png" alt="Page 2">
  <button class="hotspot fine" onclick="chooseUrgency('I’m Doing Fine – Just Curious')"></button>
  <button class="hotspot littleoff" onclick="chooseUrgency('Feeling a Little Off')"></button>
  <button class="hotspot coping" onclick="chooseUrgency('I’m Not Coping Well')"></button>
  <button class="hotspot crisis" onclick="chooseUrgency('I’m in Crisis')"></button>
  <button class="back-button" onclick="goToPage('page1')">Back</button>
</div>

<!-- Page 3 -->
<div class="page" id="page3">
  <img src="page3.png" alt="Page 3">
  <div class="counselor-grid" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:10px;">
    <button onclick="openModal('example1','example1@example.com')">example1@example.com</button>
    <button onclick="openModal('example2','example2@example.com')">example2@example.com</button>
    <button onclick="openModal('example3','example3@example.com')">example3@example.com</button>
    <button onclick="openModal('example4','example4@example.com')">example4@example.com</button>
  </div>
  <button class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<!-- Crisis Modal -->
<div class="modal-overlay" id="crisisOverlay">
  <div class="modal crisis-modal">
    <h2>Immediate Support</h2>
    <ul class="crisis-list">
      <li class="crisis-section"><strong>Emergency</strong>911 – Emergency services.</li>
      <li class="crisis-section"><strong>Mental Health & Crisis Support</strong> 988 Suicide & Crisis Lifeline – Call/text 988.<br>Crisis Text Line – Text HOME to 741741.</li>
    </ul>
    <div class="crisis-actions">
      <button class="secondary" onclick="closeCrisisModal()">Close</button>
      <button class="primary" onclick="continueFromCrisis()">Continue</button>
    </div>
  </div>
</div>

<!-- Student Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Submit Message</h2>
    <input type="text" id="firstName" placeholder="First Name (required)">
    <input type="text" id="lastName" placeholder="Last Name (required)">
    <input type="text" id="studentGrade" placeholder="Grade (required)">
    <input type="text" id="studentId" placeholder="Student ID (required)">
    <textarea id="extraNotes" placeholder="Additional notes (optional)"></textarea>
    <div class="modal-buttons">
      <button onclick="closeModal()">Cancel</button>
      <button onclick="submitMessage()">Submit</button>
    </div>
  </div>
</div>

<!-- Success Modal -->
<div class="modal-overlay" id="successOverlay">
  <div class="modal success-modal">
    <div class="success-icon">✓</div>
    <div class="success-text">Message sent!</div>
    <div class="success-actions">
      <button onclick="closeSuccess()">OK</button>
    </div>
  </div>
</div>

<script>
let selectedReason="", selectedUrgency="", selectedCounselor="", selectedCounselorEmail="";

function goToPage(id){ document.querySelectorAll(".page").forEach(p=>p.classList.remove("active")); document.getElementById(id).classList.add("active"); }
function chooseReason(reason){ selectedReason=reason; goToPage("page2"); }
function chooseUrgency(urgency){ selectedUrgency=urgency; if(urgency==="I’m in Crisis") openCrisisModal(); else goToPage("page3"); }
function openCrisisModal(){ document.getElementById("crisisOverlay").style.display="flex"; }
function closeCrisisModal(){ document.getElementById("crisisOverlay").style.display="none"; }
function continueFromCrisis(){ closeCrisisModal(); goToPage("page3"); }
function openModal(username,email){ selectedCounselor=username; selectedCounselorEmail=email; document.getElementById("modalOverlay").style.display="flex"; }
function closeModal(){ document.getElementById("modalOverlay").style.display="none"; }
function openSuccess(){ document.getElementById("successOverlay").style.display="flex"; }
function closeSuccess(){ document.getElementById("successOverlay").style.display="none"; goToPage("page1"); }

async function submitMessage(){
  const firstName=document.getElementById("firstName").value.trim();
  const lastName=document.getElementById("lastName").value.trim();
  const grade=document.getElementById("studentGrade").value.trim();
  const studentId=document.getElementById("studentId").value.trim();
  const notes=document.getElementById("extraNotes").value.trim();
  if(!firstName||!lastName||!grade||!studentId){ alert("Please fill required fields"); return; }

  try{
    const res=await fetch("/api/verifyStudent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({studentId,firstName,lastName,grade})});
    const verify=await res.json();
    if(!verify.valid){ alert("Student ID not recognized"); return; }
  }catch(err){ console.error(err); alert("Verification failed"); return; }

  const entry={ firstName,lastName,grade,studentId,notes,reason:selectedReason,urgency:selectedUrgency,counselor:selectedCounselor,counselorEmail:selectedCounselorEmail,dateTime:new Date().toISOString() };
  try{
    const res=await fetch("/api/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(entry)});
    const data=await res.json();
    if(!data.success) throw new Error("Failed to submit message");
    closeModal(); openSuccess();
    selectedReason=""; selectedUrgency=""; selectedCounselor=""; selectedCounselorEmail="";
    ["firstName","lastName","studentGrade","studentId","extraNotes"].forEach(id=>{ document.getElementById(id).value=""; });
  }catch(err){ console.error(err); alert("Failed to submit message"); }
}
</script>
</body>
</html>
