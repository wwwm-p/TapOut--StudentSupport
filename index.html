<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Support</title>

<link rel="stylesheet" href="style.css" />

<!-- ✅ PWA Manifest -->
<link rel="manifest" href="/student-manifest.json" />

<!-- ✅ Required meta -->
<meta name="theme-color" content="#0070c9" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Student Support" />

<!-- ✅ IMPORTANT: use SAME icon everywhere -->
<link rel="icon" href="/icons/icon-192-student.png">
<link rel="apple-touch-icon" href="/icons/icon-192-student.png">

<style>
* { box-sizing: border-box; margin:0; padding:0; }

.page { display: none; position: relative; }
.page.active { display: block; text-align:center; }

.page img {
  width: 100%;
  pointer-events: none;
  user-select: none;
  height: auto;
  display: block;
}

.hotspot { position: absolute; z-index: 10; cursor: pointer; }

.back-button {
  margin-top:10px;
  padding:8px 12px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  background:#ccc;
}

.counselor-grid {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

.counselor-grid button {
  padding:8px 12px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  background:#0070c9;
  color:white;
}

/* ✅ Install button */
.install-button {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 2000;
  padding: 12px 18px;
  background:#0070c9;
  color:white;
  border:none;
  border-radius:24px;
  cursor:pointer;
  font-size:16px;
  display:none;
}

body { max-width: 100%; overflow-x: hidden; }
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  <img src="page1.png">
  <button class="hotspot academic" onclick="chooseReason('Academic stress or pressure')"></button>
  <button class="hotspot anxiety" onclick="chooseReason('Anxiety or panic attacks')"></button>
  <button class="hotspot depression" onclick="chooseReason('Depression or sadness')"></button>
  <button class="hotspot family" onclick="chooseReason('Family issues or home stress')"></button>
  <button class="hotspot relationship" onclick="chooseReason('Relationship or friendship problems')"></button>
  <button class="hotspot bullying" onclick="chooseReason('Bullying or harassment')"></button>
  <button class="hotspot talk" onclick="chooseReason('I just need someone to talk to')"></button>
  <button class="hotspot unsure" onclick="chooseReason('I’m not ready to say')"></button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <img src="page2.png">
  <button class="hotspot fine" onclick="chooseUrgency('I’m Doing Fine – Just Curious')"></button>
  <button class="hotspot littleoff" onclick="chooseUrgency('Feeling a Little Off')"></button>
  <button class="hotspot coping" onclick="chooseUrgency('I’m Not Coping Well')"></button>
  <button class="hotspot crisis" onclick="chooseUrgency('I’m in Crisis')"></button>
  <button class="back-button" onclick="goToPage('page1')">Back</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <img src="page3.png">
  <div class="counselor-grid" id="counselorGrid"></div>
  <button class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<!-- ✅ INSTALL BUTTON -->
<button class="install-button" id="installButton">Install App</button>

<script>
// =======================
// STATE
// =======================
let selectedReason="",selectedUrgency="",selectedCounselor="",selectedCounselorEmail="";

// =======================
// NAVIGATION
// =======================
function goToPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id)?.classList.add("active");
}

function chooseReason(reason){
  selectedReason=reason;
  goToPage("page2");
}

function chooseUrgency(urgency){
  selectedUrgency=urgency;
  goToPage("page3");
}

// =======================
// SERVICE WORKER (CRITICAL FIX)
// =======================
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("/service-worker.js")
      .then(()=>console.log("SW registered"))
      .catch(err=>console.warn("SW failed:", err));
  });
}

// =======================
// INSTALL BUTTON (CRITICAL)
// =======================
let deferredPrompt;
const installBtn = document.getElementById("installButton");

window.addEventListener("beforeinstallprompt", (e)=>{
  console.log("PWA install available");
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", async ()=>{
  if(!deferredPrompt) return;

  installBtn.style.display = "none";
  deferredPrompt.prompt();

  const choice = await deferredPrompt.userChoice;
  console.log("Install result:", choice.outcome);

  deferredPrompt = null;
});

// =======================
// COUNSELORS
// =======================
async function populateStudentCounselorDropdown(){
  const counselors=[
    {username:"c1",email:"counselor1@example.com"}
  ];

  const grid=document.getElementById("counselorGrid");
  grid.innerHTML="";

  counselors.forEach(c=>{
    const btn=document.createElement("button");
    btn.textContent=c.email;
    btn.onclick=()=>console.log("Selected",c);
    grid.appendChild(btn);
  });
}

// =======================
// INIT
// =======================
window.onload = async()=>{
  await populateStudentCounselorDropdown();
};
</script>

</body>
</html>
