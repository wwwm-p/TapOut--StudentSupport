<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Support</title>
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box;}

/* PAGES */
.page{
  display:none;
  text-align:center;
  position:relative;
}
.page.active{
  display:block;
}
.page img{
  width:100%;
  height:auto;
  display:block;
}

/* PAGE BUTTONS */
.page button {
  display: block;
  width: 80%;
  max-width: 400px;
  margin: 10px auto;
  padding: 12px 0;
  font-size: 16px;
  font-weight: 600;
  border-radius: 12px;
  border: none;
  background: #0070c9;
  color: white;
  cursor: pointer;
  transition: background 0.2s;
}
.page button:hover {
  background: #005ea6;
}

/* Back buttons */
.back-button {
  background: #d1d5db !important;
  color: #1f2937 !important;
}
.back-button:hover {
  background: #9ca3af !important;
}

/* MODALS */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
  backdrop-filter:blur(6px);
}
.modal{
  width:360px;
  background:white;
  padding:26px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.22);
  border:1px solid #eef2f7;
}
.modal h2{
  margin:0 0 14px;
  font-size:20px;
  font-weight:700;
}
.modal input,
.modal textarea{
  width:100%;
  margin-bottom:12px;
  padding:11px;
  border-radius:12px;
  border:1px solid #e6e8ec;
  background:#f9fafb;
  text-align:center;
}
.modal textarea{
  height:90px;
  resize:none;
}
.modal-buttons{
  display:flex;
  gap:12px;
  justify-content:center;
}
.modal-buttons button{
  padding:9px 18px;
  border-radius:999px;
  border:none;
  cursor:pointer;
}
.modal-buttons button:first-child{
  background:#f1f5f9;
}
.modal-buttons button:last-child{
  background:#0070c9;
  color:white;
}

/* COUNSELOR GRID */
.counselor-grid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:20px;
}
.counselor-grid button{
  padding:10px 14px;
  border-radius:12px;
  border:none;
  background:#0070c9;
  color:white;
  cursor:pointer;
}

/* CRISIS MODAL */
.crisis-modal { width:min(560px,92vw); text-align:left; }
.crisis-modal h2 { text-align:center; }
.crisis-list { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; font-size:14px; color:#0f172a; }
.crisis-list strong { display:block; font-size:15px; }
.crisis-section { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; }
.crisis-actions { display:flex; justify-content:center; gap:12px; margin-top:14px; }
.crisis-actions .secondary { background:#f1f5f9; color:#334155; }
.crisis-actions .primary { background:#0070c9; color:white; }
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
<img src="page1.png" alt="Page 1">
<button type="button" onclick="chooseReason('Academic Stress')">Academic Stress</button>
<button type="button" onclick="chooseReason('Anxiety or Panic Attacks')">Anxiety</button>
<button type="button" onclick="chooseReason('Depression or Sadness')">Depression</button>
<button type="button" onclick="chooseReason('Family Issues')">Family Issues</button>
<button type="button" onclick="chooseReason('Relationship Problems')">Relationships</button>
<button type="button" onclick="chooseReason('Bullying')">Bullying</button>
<button type="button" onclick="chooseReason('Just Need Someone To Talk To')">Talk</button>
<button type="button" onclick="chooseReason('Not Ready To Say')">Not Ready</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
<img src="page2.png" alt="Page 2">
<button type="button" onclick="chooseUrgency('I’m Doing Fine – Just Curious')">I'm Doing Fine</button>
<button type="button" onclick="chooseUrgency('Feeling a Little Off')">Feeling A Little Off</button>
<button type="button" onclick="chooseUrgency('I’m Not Coping Well')">Not Coping Well</button>
<button type="button" onclick="chooseUrgency('I’m in Crisis')">I'm In Crisis</button>
<button type="button" class="back-button" onclick="goToPage('page1')">Back</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
<h2>Select Counselor</h2>
<div class="counselor-grid">
<button type="button" onclick="openModal('counselor1','counselor1@example.com')">counselor1@example.com</button>
<button type="button" onclick="openModal('counselor2','counselor2@example.com')">counselor2@example.com</button>
<button type="button" onclick="openModal('counselor3','counselor3@example.com')">counselor3@example.com</button>
<button type="button" onclick="openModal('counselor4','counselor4@example.com')">counselor4@example.com</button>
<button type="button" onclick="openModal('counselor5','counselor5@example.com')">counselor5@example.com</button>
<button type="button" onclick="openModal('counselor6','counselor6@example.com')">counselor6@example.com</button>
</div>
<button type="button" class="back-button" onclick="goToPage('page2')">Back</button>
</div>

<!-- CRISIS MODAL -->
<div class="modal-overlay" id="crisisOverlay">
<div class="modal crisis-modal">
<h2>Immediate Support</h2>
<ul class="crisis-list">
  <li class="crisis-section"><strong>Emergency</strong> 911 – Emergency services (police / ambulance / fire).</li>
  <li class="crisis-section"><strong>Mental Health & Crisis Support</strong> 988 Suicide & Crisis Lifeline – Call or text 988.<br>Crisis Text Line – Text HOME to 741741.</li>
</ul>
<div class="crisis-actions">
<button type="button" class="secondary" onclick="closeCrisisModal()">Close</button>
<button type="button" class="primary" onclick="continueFromCrisis()">Continue</button>
</div>
</div>
</div>

<!-- STUDENT MODAL -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h2>Submit Message</h2>
<input id="firstName" placeholder="First Name">
<input id="lastName" placeholder="Last Name">
<input id="studentGrade" placeholder="Grade">
<input id="studentId" placeholder="Student ID">
<textarea id="extraNotes" placeholder="Additional notes"></textarea>
<div class="modal-buttons">
<button type="button" onclick="closeModal()">Cancel</button>
<button type="button" onclick="submitMessage()">Submit</button>
</div>
</div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal-overlay" id="successOverlay">
<div class="modal">
<h2>Message Sent</h2>
<button type="button" onclick="closeSuccess()">OK</button>
</div>
</div>

<script>
var selectedReason = "";
var selectedUrgency = "";
var selectedCounselor = "";
var selectedCounselorEmail = "";

function goToPage(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function chooseReason(reason){ selectedReason=reason; goToPage("page2"); }
function chooseUrgency(urgency){ selectedUrgency=urgency; (urgency==="I’m in Crisis") ? openCrisisModal() : goToPage("page3"); }
function openCrisisModal(){ document.getElementById("crisisOverlay").style.display="flex"; }
function closeCrisisModal(){ document.getElementById("crisisOverlay").style.display="none"; }
function continueFromCrisis(){ closeCrisisModal(); goToPage("page3"); }
function openModal(username,email){ selectedCounselor=username; selectedCounselorEmail=email; document.getElementById("modalOverlay").style.display="flex"; }
function closeModal(){ document.getElementById("modalOverlay").style.display="none"; }
function openSuccess(){ document.getElementById("successOverlay").style.display="flex"; }
function closeSuccess(){ document.getElementById("successOverlay").style.display="none"; goToPage("page1"); }

function submitMessage(){
  var firstName=document.getElementById("firstName").value.trim();
  var lastName=document.getElementById("lastName").value.trim();
  var grade=document.getElementById("studentGrade").value.trim();
  var studentId=document.getElementById("studentId").value.trim();
  var notes=document.getElementById("extraNotes").value.trim();

  if(!firstName||!lastName||!grade||!studentId){ alert("Please fill in all required fields."); return; }

  // Verify Student
  fetch("/api/verifyStudent",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ student_id: studentId })
  })
  .then(res=>res.json())
  .then(verify=>{
    if(!verify.valid){ alert("Student ID not recognized."); throw new Error("invalid"); }

    return fetch("/api/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        student_id: studentId,
        counselor_username:selectedCounselor,
        notes:notes,
        reason:selectedReason,
        urgency:selectedUrgency
      })
    });
  })
  .then(res=>res.json())
  .then(data=>{
    if(!data.success) throw new Error("Failed to send");
    closeModal(); openSuccess();
    selectedReason=""; selectedUrgency=""; selectedCounselor=""; selectedCounselorEmail="";
    ["firstName","lastName","studentGrade","studentId","extraNotes"].forEach(id=>document.getElementById(id).value="");
  })
  .catch(err=>{ console.error(err); alert("Failed to send message."); });
}
</script>

</body>
</html>
